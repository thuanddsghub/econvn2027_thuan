# Frozen configuration contract for the manuscript experiment.
seed: 42

data:
  symbol: ETH-USD
  frequency: 1h
  context_length: 168
  horizons: [1, 6, 24]
  features: [log_return, log_volume, high_low_range, rv_24h]
  primary_volatility_feature: rv_24h
  volatility_window: 24
  regime_threshold_feature: rv_24h
  regime_threshold_fit: train_only
  diagnostic_volatility_features: [rv_168h]
  train_end: "2023-12-31T23:00:00Z"
  validation_end: "2024-12-31T23:00:00Z"

scaling:
  input_scaler: train_only_standard_zscore
  target_parameterization: train_standardized_log_return
  target_scaler_fit: train_log_return_only
  targets_saved_in: original_log_return_units

diffusion:
  context_encoder: GRU
  context_hidden_size: 32
  context_layers: 1
  diffusion_steps: 100
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02
  reverse_variance: ddpm_posterior_variance
  t0_noise: false

model:
  volatility_conditioning_feature: rv_24h
  volatility_conditioning: true

training:
  seeds: [42, 123, 2024, 3407, 7777]
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.00001
  max_epochs: 10
  selection: validation_only
  sample_count: 100
  test_tuning: false
  targets_scaled: false  # feature scaler never transforms saved/evaluated targets

models:
  standard_diffusion:
    volatility_conditioning: false
  va_diff:
    volatility_conditioning: true
    volatility_feature: rv_24h
    volatility_source: forecast_origin_only

regimes:
  feature: rv_24h
  thresholds: train_only_q33_q67
  definitions:
    low: rv_24h < q33
    medium: q33 <= rv_24h < q67
    high: rv_24h >= q67

evaluation:
  primary_metric: CRPS
  secondary_metrics: [MAE, RMSE, PICP90, interval_width]
  paired_unit: seed

experiment:
  primary_volatility_feature: rv_24h
  volatility_sensitivity_mode: false
  diagnostic_volatility_features: [rv_168h]

policy:
  rv_168h_primary_use: false
  no_random_split: true
  no_future_leakage: true
  no_additional_model_training: true
