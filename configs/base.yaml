seed: 42

data:
  symbol: ETH-USD
  frequency: 1h
  context_length: 168
  horizons: [1, 6, 24]
  # Primary volatility feature for all main-manuscript experiments.
  primary_volatility_feature: rv_24h
  # Keep the default window explicit; rv_168h is diagnostic only.
  volatility_window: 24
  diagnostic_volatility_features: [rv_168h]
  regime_threshold_feature: rv_24h
  regime_threshold_fit: train_only
  train_end: "2023-12-31"
  val_end: "2024-12-31"

model:
  name: va_diff
  hidden_dim: 128
  diffusion_steps: 100
  beta_start: 0.0001
  beta_end: 0.02
  volatility_conditioning: true
  # The default VA-Diff conditioning input is rv_24h, never rv_168h.
  volatility_conditioning_feature: rv_24h

training:
  batch_size: 128
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  # Forecast targets remain in original log-return scale; feature scaling is input-only.
  targets_scaled: false

task08a:
  seed: 42
  model: lstm
  hidden_size: 16
  num_layers: 1
  batch_size: 1024
  epochs: 4
  patience: 2
  learning_rate: 0.001
  weight_decay: 0.00001
  target_scale: original_log_return
  selection: validation_only

task08b:
  seed: 42
  model: transformer_encoder
  d_model: 32
  nhead: 4
  num_layers: 2
  feedforward_dim: 64
  dropout: 0.1
  front_end: learnable_conv1d
  front_end_kernel_size: 8
  front_end_stride: 8
  front_end_padding: 4
  uses_all_context_observations: true
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.00001
  max_epochs: 4
  target_scale: original_log_return
  selection: validation_only

sampling:
  n_samples: 500

experiment:
  primary_metric: crps
  regimes: [low, medium, high]
  primary_volatility_feature: rv_24h
  # False is mandatory for the main/default experiment. Set true only for
  # explicitly labeled post-main sensitivity/diagnostic analyses.
  volatility_sensitivity_mode: false
  diagnostic_volatility_features: [rv_168h]
  diagnostic_feature_policy: "rv_168h may be used only for descriptive diagnostics, post-main sensitivity/robustness checks, or supplementary figures/tables; never for primary conditioning, regime thresholds, headline tables, model selection, or tuning."
