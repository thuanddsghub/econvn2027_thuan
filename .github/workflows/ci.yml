name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: make paper-audit
      - name: Verify frozen audit outputs are reproducible
        run: git diff --exit-code -- outputs/final/FINAL_EXPERIMENT_REPORT.md outputs/final/final_audit_report.json
