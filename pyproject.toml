[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "va-diff-eth"
version = "0.1.0"
description = "Volatility-Aware Diffusion Models for ETH/USD return forecasting"
requires-python = ">=3.11,<3.15"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "tqdm>=4.66",
  "pyarrow>=17.0",
  "statsmodels>=0.14",
  "arch>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
